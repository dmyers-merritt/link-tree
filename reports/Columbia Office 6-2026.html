document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<title>Merritt Properties — Columbia Office Market Report<\u002Ftitle>\n<style>/* =============================================================\n   Merritt Properties — Colors & Type\n   The single source of truth for color tokens, typography, and\n   semantic styles. Import once at the root of any artifact:\n\n       <link rel=\"stylesheet\" href=\"colors_and_type.css\" />\n\n   Built around Merritt's brand palette (Properties Green +\n   institutional Navy) and the Tungsten / Avenir Next pairing.\n   ============================================================= */\n\n\n/* ---------- Web fonts -------------------------------------- */\n/* Tungsten — display / headers. Semibold is the workhorse. */\n@font-face { font-family: \"Tungsten\"; src: url(\"2f46f2cb-3a6b-4aef-ba3f-85379b017053\")    format(\"opentype\"); font-weight: 300; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Tungsten\"; src: url(\"7d2cc73f-2fd6-4b41-aad6-e2bc374a9a5b\")     format(\"opentype\"); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Tungsten\"; src: url(\"3cde26de-48e3-43c3-934e-548795982d6d\")   format(\"opentype\"); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Tungsten\"; src: url(\"5c2e62fc-f3a5-483b-afd1-2dab9ea43d9a\") format(\"opentype\"); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Tungsten\"; src: url(\"8d15a13e-4af7-4555-9958-b6d0f98747bd\")     format(\"opentype\"); font-weight: 700; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Tungsten\"; src: url(\"9b014891-9aae-4e67-87b3-01cb16188522\")    format(\"opentype\"); font-weight: 900; font-style: normal; font-display: swap; }\n\n/* Avenir Next LT Pro — body, UI, tables. Never use Cn or Rounded variants. */\n@font-face { font-family: \"Avenir Next\"; src: url(\"4cdacbf3-42f1-41b7-8612-be5282c8ff49\")    format(\"opentype\"); font-weight: 300; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"fb2c51ac-a19f-42db-9024-50062418aee9\")  format(\"opentype\"); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"9478c685-2544-4bf2-95e7-eebe0faa7f5a\")       format(\"opentype\"); font-weight: 400; font-style: italic; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"6bd439a4-716f-4e99-9a38-293fa2e3c8ba\")   format(\"opentype\"); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"2ca3befb-5ccb-40eb-8d3b-915767ae61bb\") format(\"opentype\"); font-weight: 500; font-style: italic; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"fe44c074-05af-4005-9980-dcbc28ecdaba\")     format(\"opentype\"); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"e88df16b-de43-42d8-b637-f51e8843535a\")   format(\"opentype\"); font-weight: 600; font-style: italic; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"a66f176c-6e84-434d-b0a8-1fa624ca6a4f\")     format(\"opentype\"); font-weight: 700; font-style: normal; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"e2d1d9b4-ae62-4629-878b-535f5d546723\")   format(\"opentype\"); font-weight: 700; font-style: italic; font-display: swap; }\n@font-face { font-family: \"Avenir Next\"; src: url(\"9aae4140-7e81-43dc-b67c-bc5484f63af4\")    format(\"opentype\"); font-weight: 800; font-style: normal; font-display: swap; }\n\n\n:root {\n  /* ---------- Brand color palette ------------------------- */\n  /* Primary */\n  --color-properties-green: #64a70b;   /* Pantone 369 C — primary brand */\n  --color-navy:             #002f6c;   /* Merritt brand navy */\n\n  /* Secondary */\n  --color-deep-green:       #00953b;\n  --color-light-blue:       #0085ad;\n  --color-sky-blue:         #00aec7;\n  --color-slate:            #4d5858;\n  --color-cool-gray:        #d9d8d6;\n\n  /* Neutrals (extended for surfaces, lines, text hierarchy) */\n  --color-ink:              #0a1726;   /* near-black, navy-tinted */\n  --color-graphite:         #2a323a;\n  --color-stone:            #6b7480;\n  --color-silver:           #aab2bb;\n  --color-mist:             #e8eaec;\n  --color-fog:              #f1f2f3;\n  --color-cream:            #f7f6f2;   /* warm card background */\n  --color-paper:            #ffffff;\n\n  /* Tinted variants (for hover, fills, banded rows) */\n  --color-green-700:        #4f8408;\n  --color-green-100:        #eaf4d7;\n  --color-green-050:        #f4faea;\n  --color-navy-700:         #001f48;\n  --color-navy-100:         #d7dee9;\n  --color-navy-050:         #eef1f6;\n  --color-sky-100:          #d6f1f6;\n\n  /* Status / data viz */\n  --color-positive:         var(--color-deep-green);\n  --color-negative:         #b3261e;\n  --color-warning:          #c98300;\n  --color-info:             var(--color-light-blue);\n\n  /* ---------- Semantic surfaces ---------------------------- */\n  --bg-page:        var(--color-fog);\n  --bg-canvas:      var(--color-paper);\n  --bg-card:        var(--color-paper);\n  --bg-card-warm:   var(--color-cream);\n  --bg-muted:       var(--color-mist);\n  --bg-inverse:     var(--color-navy);\n\n  /* Text */\n  --fg-1:           var(--color-ink);          /* primary */\n  --fg-2:           var(--color-graphite);     /* body */\n  --fg-3:           var(--color-stone);        /* muted */\n  --fg-4:           var(--color-silver);       /* placeholder / disabled */\n  --fg-on-dark:     #ffffff;\n  --fg-on-green:    #ffffff;\n  --fg-link:        var(--color-properties-green);\n  --fg-link-hover:  var(--color-green-700);\n\n  /* Borders / lines */\n  --border-1:       #e3e5e8;\n  --border-2:       #cfd2d6;\n  --border-strong:  var(--color-slate);\n  --border-accent:  var(--color-properties-green);\n\n  /* ---------- Type families ------------------------------- */\n  --font-display:   \"Tungsten\", \"Oswald\", \"Bebas Neue\", \"Arial Narrow\", sans-serif;\n  --font-body:      \"Avenir Next\", \"Nunito Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono:      ui-monospace, SFMono-Regular, Menlo, Consolas, \"Liberation Mono\", monospace;\n\n  /* ---------- Radii / lines / shadows --------------------- */\n  --radius-0: 0px;\n  --radius-1: 2px;     /* default — Merritt is minimal-radius */\n  --radius-2: 3px;     /* maximum — buttons, cards */\n  --radius-pill: 999px;\n\n  --hairline: 1px solid var(--border-1);\n  --rule:     1px solid var(--border-2);\n\n  --shadow-card:    0 1px 2px rgba(10, 23, 38, 0.06), 0 1px 1px rgba(10, 23, 38, 0.04);\n  --shadow-raised:  0 6px 18px rgba(10, 23, 38, 0.08), 0 2px 4px rgba(10, 23, 38, 0.04);\n  --shadow-modal:   0 24px 48px rgba(10, 23, 38, 0.18), 0 8px 16px rgba(10, 23, 38, 0.08);\n  --shadow-inset:   inset 0 0 0 1px var(--border-1);\n\n  /* ---------- Spacing scale (4px base) -------------------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ---------- Type scale ---------------------------------- */\n  /* Display (Tungsten Semibold, tight tracking, ALL CAPS or sentence) */\n  --fs-display-xl:  88px;\n  --fs-display-lg:  64px;\n  --fs-display-md:  48px;\n  --fs-display-sm:  36px;\n\n  /* Headings (Tungsten Semibold) */\n  --fs-h1: 40px;\n  --fs-h2: 32px;\n  --fs-h3: 24px;\n  --fs-h4: 20px;\n\n  /* Body / UI (Avenir Next) */\n  --fs-body-lg: 18px;\n  --fs-body:    16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 12px;\n  --fs-overline: 11px;\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2;  /* @kind other */\n  --lh-base:    1.5;  /* @kind other */\n  --lh-relaxed: 1.6;  /* @kind other */\n\n  /* Letter spacing */\n  --tracking-tight:    -0.01em;\n  --tracking-normal:    0;\n  --tracking-wide:      0.04em;\n  --tracking-overline:  0.12em;\n}\n\n\n/* ---------- Semantic element styles ---------------------- */\n/* Apply by either using these classes OR setting these as\n   defaults in your component css. They are CSS classes, not\n   element selectors, to avoid stomping host pages.           */\n\n.h-display-xl, .h-display-lg, .h-display-md, .h-display-sm,\n.h1, .h2, .h3, .h4 {\n  font-family: var(--font-display);\n  font-weight: 600;          /* Tungsten Semibold = primary */\n  color: var(--fg-1);\n  letter-spacing: var(--tracking-normal);\n  line-height: var(--lh-tight);\n  margin: 0;\n  text-wrap: balance;\n}\n\n.h-display-xl { font-size: var(--fs-display-xl); }\n.h-display-lg { font-size: var(--fs-display-lg); }\n.h-display-md { font-size: var(--fs-display-md); }\n.h-display-sm { font-size: var(--fs-display-sm); }\n\n.h1 { font-size: var(--fs-h1); line-height: var(--lh-snug); }\n.h2 { font-size: var(--fs-h2); line-height: var(--lh-snug); }\n.h3 { font-size: var(--fs-h3); line-height: var(--lh-snug); }\n.h4 { font-size: var(--fs-h4); line-height: var(--lh-snug); }\n\n.eyebrow,\n.overline {\n  font-family: var(--font-body);\n  font-weight: 600;          /* Avenir Demi */\n  font-size: var(--fs-overline);\n  letter-spacing: var(--tracking-overline);\n  text-transform: uppercase;\n  color: var(--color-properties-green);\n}\n\n.p, .body {\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n  margin: 0;\n}\n.body-lg { font-size: var(--fs-body-lg); }\n.body-sm { font-size: var(--fs-body-sm); }\n.caption { font-size: var(--fs-caption); color: var(--fg-3); }\n\n.label {\n  font-family: var(--font-body);\n  font-weight: 600;          /* Avenir Demi */\n  font-size: var(--fs-body-sm);\n  letter-spacing: 0.02em;\n  color: var(--fg-1);\n}\n\n.mono,\n.tabular {\n  font-family: var(--font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0;\n}\n\n.link {\n  color: var(--fg-link);\n  text-decoration: none;\n  border-bottom: 1px solid transparent;\n  transition: color 120ms ease, border-color 120ms ease;\n}\n.link:hover { color: var(--fg-link-hover); border-bottom-color: currentColor; }\n\n/* Utilities frequently needed in reports */\n.num    { font-variant-numeric: tabular-nums; }\n.muted  { color: var(--fg-3); }\n.strong { font-weight: 600; color: var(--fg-1); }\n<\u002Fstyle>\n<style>\n  :root { --pad: 42px; --gap: 18px; }\n  html, body { margin: 0; background: #2a323a; font-family: var(--font-body); color: var(--fg-1); }\n  body { padding: 32px; display: grid; place-items: center; }\n\n  .page {\n    width: 8.5in; min-height: 22in; background: #fff;\n    box-shadow: 0 24px 60px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.2);\n    display: flex; flex-direction: column;\n    position: relative;\n  }\n  @media print {\n    @page { size: letter portrait; margin: 0; }\n    html, body { background: #fff; padding: 0; display: block; }\n    .page { box-shadow: none; }\n  }\n\n  /* ---------- BRAND BAR ---------- */\n  .brandbar {\n    background: var(--color-navy); color: #fff;\n    display: flex; align-items: stretch; justify-content: space-between;\n    border-bottom: 4px solid var(--color-properties-green);\n    min-height: 74px;\n  }\n  .brandbar .logo-panel {\n    background: #043476; padding: 8px 36px 8px var(--pad);\n    display: flex; align-items: center;\n    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);\n  }\n  .brandbar .logo-panel img { height: 52px; display: block; }\n  .brandbar .label-wrap { flex: 1; display: flex; align-items: center; padding: 0 var(--pad); }\n  .brandbar .label {\n    font: 600 15px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: #fff;\n  }\n  .brandbar .label .accent { color: #9bd64a; margin-right: 8px; font-weight: 700; }\n  .brandbar .date-wrap {\n    background: rgba(0,0,0,.18); padding: 0 var(--pad);\n    display: flex; flex-direction: column; justify-content: center; align-items: flex-end;\n    border-left: 1px solid rgba(255,255,255,.1);\n  }\n  .brandbar .date-l {\n    font: 600 9px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase;\n    color: rgba(255,255,255,.55); margin-bottom: 4px;\n  }\n  .brandbar .date {\n    font: 600 13px/1 var(--font-body); letter-spacing: .08em; color: #9bd64a;\n  }\n\n  /* ---------- TITLE ---------- */\n  .title-block {\n    padding: 24px var(--pad) 20px; background: var(--color-cream);\n    border-bottom: 1px solid var(--border-1);\n  }\n  .title-block .eyebrow {\n    font: 600 10px/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase;\n    color: var(--color-properties-green); margin-bottom: 6px;\n  }\n  .title-block h1 {\n    font: 600 52px/.95 var(--font-display); margin: 0; color: var(--color-navy);\n    letter-spacing: .005em;\n  }\n  .title-block .scope {\n    font: 500 11px/1.4 var(--font-body); color: var(--fg-3); margin-top: 10px; letter-spacing: .02em;\n  }\n\n  /* ---------- SECTION MARKERS ---------- */\n  .sec-marker {\n    display: flex; align-items: baseline; gap: 16px;\n    padding: 24px var(--pad) 10px; margin: 0;\n    border-top: 1px solid var(--border-1);\n    background: #fff;\n  }\n  .sec-marker:first-of-type { border-top: 0; }\n  .sec-marker .num {\n    font: 700 36px/1 var(--font-display); color: var(--color-properties-green);\n    letter-spacing: .02em;\n  }\n  .sec-marker .title {\n    font: 600 18px/1 var(--font-display); color: var(--color-navy);\n    letter-spacing: .18em; text-transform: uppercase;\n  }\n  .sec-marker .meta {\n    font: 500 10px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase;\n    color: var(--fg-3); margin-left: auto;\n  }\n  .sec-marker .rule {\n    flex: 1; height: 2px; background: var(--color-navy);\n    margin: 0 16px 0 4px; align-self: center;\n  }\n\n  /* ---------- HERO KPI BAND ---------- */\n  .kpi-hero {\n    display: grid; grid-template-columns: repeat(5, 1fr);\n    padding: 8px var(--pad) 24px;\n    background: #fff;\n  }\n  .kpi-card {\n    padding: 16px 18px 14px;\n    border-right: 1px solid var(--border-1);\n    position: relative;\n  }\n  .kpi-card:last-child { border-right: 0; }\n  .kpi-card .lab {\n    font: 600 9px/1.2 var(--font-body); letter-spacing: .14em; text-transform: uppercase;\n    color: var(--fg-3); margin-bottom: 12px; white-space: nowrap;\n    padding-left: 10px; border-left: 2px solid var(--color-properties-green);\n  }\n  .kpi-card .val {\n    font: 600 42px/1 var(--font-display); color: var(--color-navy);\n    font-variant-numeric: tabular-nums;\n    display: flex; align-items: baseline; gap: 4px; flex-wrap: nowrap;\n  }\n  .kpi-card .val small { font-size: 15px; color: var(--fg-3); font-weight: 600; letter-spacing: 0; }\n  .kpi-card .chip {\n    display: inline-flex; align-items: center; gap: 4px;\n    font: 600 10px/1 var(--font-body); letter-spacing: .04em;\n    padding: 4px 8px; border-radius: 2px; margin-top: 10px;\n  }\n  .kpi-card .chip.pos { background: var(--color-green-100); color: var(--color-deep-green); }\n  .kpi-card .chip.neg { background: #fde6e3; color: #b3261e; }\n  .kpi-card .chip.flat { background: var(--color-mist); color: var(--fg-3); }\n\n  /* ---------- BODY ---------- */\n  .body { display: flex; flex-direction: column; flex: 1; }\n\n  /* ---------- BLURB ---------- */\n  .blurb-block {\n    padding: 16px var(--pad) 24px;\n    background: linear-gradient(180deg, var(--color-cream) 0%, #fff 100%);\n  }\n  .blurb-block .lab {\n    font: 600 10px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase;\n    color: var(--color-properties-green); margin-bottom: 8px;\n  }\n  .blurb-block p {\n    font: 400 12.5px/1.7 var(--font-body); color: var(--fg-2); margin: 0 0 10px;\n    max-width: none; text-wrap: pretty;\n  }\n  .blurb-block p:last-child { margin-bottom: 0; }\n  .blurb-block strong { color: var(--color-navy); font-weight: 600; }\n  .draft-tag {\n    display: inline-block; font: 600 9px/1 var(--font-body); letter-spacing: .14em;\n    text-transform: uppercase; background: #c98300; color: #fff;\n    padding: 4px 8px; border-radius: 2px; margin-left: 10px; vertical-align: middle;\n  }\n\n  /* ---------- TWO-COL ROW ---------- */\n  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); padding: 0 var(--pad) 20px; }\n  .row-1 { padding: 0 var(--pad) 20px; }\n\n  /* ---------- SUBMARKET BREAKDOWN + VACANCY COMPARISON ---------- */\n  .stat-grid {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\n    padding: 0 var(--pad) 24px;\n  }\n  .stat-panel {\n    background: #fff; border: 1px solid var(--border-1); padding: 16px 18px;\n  }\n  .stat-panel .head {\n    font: 600 11px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase;\n    color: var(--color-navy); margin-bottom: 4px;\n  }\n  .stat-panel .sub {\n    font: 500 9.5px/1.4 var(--font-body); color: var(--fg-3); letter-spacing: .04em; margin-bottom: 16px;\n  }\n\n  /* Submarket performance cards */\n  .sub-list { display: flex; flex-direction: column; gap: 10px; }\n  .sub-item {\n    display: grid; grid-template-columns: 8px 1fr auto; gap: 12px;\n    align-items: center;\n    padding: 10px 12px; background: var(--color-fog);\n  }\n  .sub-item .bar { width: 4px; height: 100%; min-height: 36px; background: var(--color-properties-green); }\n  .sub-item .info .name { font: 600 12px/1.1 var(--font-body); color: var(--fg-1); letter-spacing: .01em; }\n  .sub-item .info .stats { font: 500 10px/1.4 var(--font-body); color: var(--fg-3); margin-top: 3px; font-variant-numeric: tabular-nums; }\n  .sub-item .pct {\n    font: 600 24px/1 var(--font-display); color: var(--color-navy);\n    font-variant-numeric: tabular-nums; text-align: right;\n  }\n  .sub-item .pct small { font-size: 10px; color: var(--fg-3); font-weight: 600; }\n\n  /* Vacancy comparison */\n  .vac-row { margin-bottom: 14px; }\n  .vac-row:last-child { margin-bottom: 4px; }\n  .vac-row .lbl-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }\n  .vac-row .vlabel { font: 600 11px/1 var(--font-body); color: var(--fg-1); letter-spacing: .02em; }\n  .vac-row .vchange { font: 600 10px/1 var(--font-body); }\n  .vac-row .vchange.pos { color: var(--color-deep-green); }\n  .vac-row .vchange.neg { color: #b3261e; }\n  .vac-track {\n    height: 22px; background: var(--color-fog); position: relative;\n    border: 1px solid var(--border-1);\n  }\n  .vac-track .vprior {\n    position: absolute; left: 0; top: 0; bottom: 0;\n    background: repeating-linear-gradient(135deg, #d8def0, #d8def0 3px, #c5cee0 3px, #c5cee0 6px);\n  }\n  .vac-track .vcurrent {\n    position: absolute; left: 0; top: 0; bottom: 0;\n    display: flex; align-items: center; padding-left: 8px;\n    font: 600 12px/1 var(--font-body); color: #fff; letter-spacing: .02em;\n    font-variant-numeric: tabular-nums;\n  }\n  .vac-track .vcurrent.market { background: var(--color-navy); }\n  .vac-track .vcurrent.merritt { background: var(--color-properties-green); }\n  .vac-scale {\n    display: flex; justify-content: space-between; margin-top: 4px;\n    font: 500 8.5px/1 var(--font-body); color: var(--fg-4); letter-spacing: .04em;\n  }\n  .vac-key {\n    display: flex; gap: 14px; margin-top: 12px;\n    padding-top: 10px; border-top: 1px dashed var(--border-1);\n    font: 500 9.5px/1.2 var(--font-body); color: var(--fg-3); letter-spacing: .04em;\n  }\n  .vac-key .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: middle; }\n\n  /* ---------- TABLES ---------- */\n  table.data {\n    width: 100%; border-collapse: collapse; font: 400 10.5px/1.35 var(--font-body); color: var(--fg-2);\n  }\n  table.data th {\n    background: var(--color-cr color: rgba(255,255,255,.6); }\n  .footer .pg { color: #9bd64a; font-weight: 600; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\" data-screen-label=\"Columbia Office Market Report\">\n\n  <!-- BRAND BAR -->\n  <header class=\"brandbar\">\n    <div class=\"logo-panel\">\n      <img src=\"ad634fe8-4a13-4715-b033-df811222fe1a\" alt=\"Merritt Properties\">\n    <\u002Fdiv>\n    <div class=\"label-wrap\">\n      <span class=\"label\"><span class=\"accent\">/<\u002Fspan>Columbia Office Market Report<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"date-wrap\">\n      <span class=\"date-l\">Report Date<\u002Fspan>\n      <span class=\"date\">June 8, 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- TITLE -->\n  <section class=\"title-block\">\n    <div class=\"eyebrow\">Office Market Spotlight · June 2026<\u002Fdiv>\n    <h1>Columbia Office<\u002Fh1>\n    <div class=\"scope\">Submarket-level report · Corridor market · Columbia North &amp; Columbia South · Howard County<\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"body\">\n\n    <!-- ===== 01 / MARKET PULSE ===== -->\n    <div class=\"sec-marker\">\n      <span class=\"num\">01<\u002Fspan><span class=\"title\">Market Pulse<\u002Fspan>\n      <span class=\"rule\"><\u002Fspan>\n      <span class=\"meta\">12-month change vs. prior period<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"kpi-hero\">\n      <div class=\"kpi-card\">\n        <div class=\"lab\">Merritt Vacancy<\u002Fdiv>\n        <div class=\"val\">21.6<small>%<\u002Fsmall><\u002Fdiv>\n        <div class=\"chip neg\">▲ 218 bps YOY<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi-card\">\n        <div class=\"lab\">Market Vacancy<\u002Fdiv>\n        <div class=\"val\">19.6<small>%<\u002Fsmall><\u002Fdiv>\n        <div class=\"chip pos\">▼ 20 bps YOY<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi-card\">\n        <div class=\"lab\">Total Market SF<\u002Fdiv>\n        <div class=\"val\">9.9<small>M<\u002Fsmall><\u002Fdiv>\n        <div class=\"chip flat\">— Flat YOY<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi-card\">\n        <div class=\"lab\">12-Mo Absorption<\u002Fdiv>\n        <div class=\"val\">+24.1<small>K SF<\u002Fsmall><\u002Fdiv>\n        <div class=\"chip neg\">▼ 77% YOY<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"kpi-card\">\n        <div class=\"lab\">Avg. Asking Rate<\u002Fdiv>\n        <div class=\"val\">$29.36<small>FS<\u002Fsmall><\u002Fdiv>\n        <div class=\"chip neg\">▼ 0.5% YOY<\u002Fdiv>\n        <div style=\"font: 500 8px/1.2 var(--font-body); color: var(--fg-4); margin-top: 7px; letter-spacing: .04em;\">Incl. Downtown Columbia<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== 02 / NARRATIVE ===== -->\n    <div class=\"sec-marker\">\n      <span class=\"num\">02<\u002Fspan><span class=\"title\">Narrative<\u002Fspan>\n      <span class=\"rule\"><\u002Fspan>\n      <span class=\"meta\">Analyst commentary<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"blurb-block\">\n      <div class=\"lab\">Market Blurb<\u002Fdiv>\n      <p>The <strong>Columbia<\u002Fstrong> office market held in equilibrium over the trailing twelve months, posting positive but decelerating net absorption of <strong>+24,100 SF<\u002Fstrong> against a <strong>9.9M SF<\u002Fstrong> base — down sharply from the prior period's <strong>107,000 SF<\u002Fstrong>. Vacancy edged down to <strong>19.6%<\u002Fstrong> (-20 bps YOY), and with <strong>no office product under construction<\u002Fstrong>, supply pressure is limited to the existing standing inventory. Average asking rents slipped marginally to <strong>$29.36/SF Full Service<\u002Fstrong> (-0.5% YOY), indicating landlords are holding headline rates while competing on concessions across a market where availability remains elevated at roughly <strong>2.5M SF<\u002Fstrong> spread across <strong>322 available spaces<\u002Fstrong> in 75 buildings.<\u002Fp>\n      <p>Within the Merritt portfolio, office vacancy rose to <strong>21.6%<\u002Fstrong> (+218 bps YOY) with negative absorption of <strong>(20,634) SF<\u002Fstrong> — but the deterioration is concentrated entirely in the <strong>Class B<\u002Fstrong> product. Vacancy across Merritt's Class B buildings (Lyndwood Executive Center and Meadowridge 95) jumped <strong>820 bps to 37.0%<\u002Fstrong>, driven principally by <strong>Microsoft's 22,242 SF<\u002Fstrong> move-out at Meadowridge 95 Building II. By contrast, the <strong>Class A<\u002Fstrong> portfolio — Columbia Corporate Park and CCP 100 — held firm at <strong>15.4% vacancy<\u002Fstrong> (-26 bps YOY on positive absorption), outperforming both the Class B stock and the broader market. Renewal velocity remains the steadying theme in the Class A buildings, led by <strong>CDW Technologies' 27,758 SF<\u002Fstrong> renewal at Columbia Corporate Park 5. Available product skews to the smaller-tenant bands — <strong>28 of 37 suites<\u002Fstrong> sit below 10,000 SF, mirroring the ~75% sub-10,000 SF market — with the Class B value space priced near <strong>$24.50/SF<\u002Fstrong>, well below a Columbia office market averaging <strong>$29.36/SF<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Submarket Breakdown + Vacancy Comparison -->\n    <div class=\"stat-grid\">\n      <div class=\"stat-panel\">\n        <div class=\"head\">Submarket Breakdown<\u002Fdiv>\n        <div class=\"sub\">Merritt office availability within Columbia<\u002Fdiv>\n        <div class=\"sub-list\">\n          <div class=\"sub-item\">\n            <div class=\"bar\"><\u002Fdiv>\n            <div class=\"info\">\n              <div class=\"name\">Columbia North<\u002Fdiv>\n              <div class=\"stats\">13 spaces · 129,261 SF avail · $24.52 avg<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"pct\">52<small>% of avail<\u002Fsmall><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sub-item\">\n            <div class=\"bar\" style=\"background: var(--color-light-blue);\"><\u002Fdiv>\n
